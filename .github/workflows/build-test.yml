name: Build and Test

# Runs on every PR whatever it changes: Renovate auto-merges once checks pass, and an update to a
# workflow, mise.toml, nuget.config or global.json can break the build without touching src/.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Credentials for the "chrismeller" GitHub Packages source in nuget.config.
      NuGetPackageSourceCredentials_chrismeller: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The .NET SDK (pinned in global.json), Node and pnpm, from mise.toml.
      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test tests/LumexUI.Tests -c Release --no-build --no-restore --verbosity normal --collect:"XPlat Code Coverage"

      # Pack what was just built and check that the package has what consumers need (theme files, targets,
      # popover.bundle.js, the icons assembly). The release workflow runs the same check before it pushes.
      - name: Pack
        run: dotnet pack src/LumexUI/LumexUI.csproj -c Release --no-build --output artifacts/packages

      - name: Check package contents
        run: dotnet run scripts/check-package.cs -- artifacts/packages/LumexUI.*.nupkg

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # The smoke tests run real Chromium against the published docs site, so the JS that the unit tests mock
      # (popover.bundle.js, the component scripts, Blazor WebAssembly) is executed. See tests/LumexUI.Docs.SmokeTests.
      - name: Publish the docs site
        run: dotnet publish docs/LumexUI.Docs -c Release --no-restore -o artifacts/docs

      # No --with-deps: the runner image already has every library Chromium needs, and the only packages it added
      # were extra fonts (CJK, Thai, X11) the tests don't use. Fetching them through apt took 4 to 5 minutes on a
      # slow mirror. The browser itself is cached per Playwright version, and only the headless shell is installed.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(sed -n 's/.*Include="Microsoft.Playwright" Version="\([^"]*\)".*/\1/p' tests/LumexUI.Docs.SmokeTests/LumexUI.Docs.SmokeTests.csproj)" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh tests/LumexUI.Docs.SmokeTests/bin/Release/net10.0/playwright.ps1 install --only-shell chromium

      - name: Browser smoke tests
        run: dotnet test tests/LumexUI.Docs.SmokeTests -c Release --no-build --no-restore --verbosity normal
        env:
          LUMEXUI_DOCS_PATH: ${{ github.workspace }}/artifacts/docs
