name: Dependency submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  dependency-submission:
    name: Restore and submit dependencies
    runs-on: ubuntu-latest

    env:
      # "chrismeller" must match the source key in NuGet.config.
      NuGetPackageSourceCredentials_chrismeller: >-
        Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.x

      - name: Restore solution
        run: dotnet restore ./LumexUI.sln

      - name: Scan repository and submit dependencies
        uses: advanced-security/component-detection-dependency-submission-action@9887d3a4295305f4e7b03a1cfdb2099d44cadf52 # v0.2.1
        with:
          filePath: .
          correlator: component-detection
