name: Release

on:
  push:
    branches:
      - main
  # Publishes an existing release again, for when the publish job failed after release-please had already
  # tagged it. Re-running the failed run doesn't help when the fix is in this file, because a re-run uses the
  # workflow as it was at that run's commit.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v3.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # Keeps a release PR open that bumps the version (the csproj's <Version>) and CHANGELOG from the
      # conventional commits merged since the last release. Merging that PR tags the release and creates the
      # GitHub release. PRs opened with GITHUB_TOKEN don't trigger other workflows, so CI won't run on the
      # release PR; set a RELEASE_PLEASE_TOKEN secret (a fine-grained PAT or GitHub App token) if it needs to.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing runs here rather than on a release event: a release created with GITHUB_TOKEN doesn't
  # trigger other workflows.
  publish:
    needs: release-please
    # always() so a manual run, which skips release-please, still gets here.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
    env:
      # Credentials for the "chrismeller" source in nuget.config (LumexUI.Motion).
      NuGetPackageSourceCredentials_chrismeller: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
          persist-credentials: false

      # The .NET SDK (pinned in global.json), Node and pnpm, from mise.toml. Node and pnpm build
      # popover.bundle.js during the build.
      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5

      # Build the whole solution, run the same tests as Build and Test, then pack exactly what was tested.
      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test tests/LumexUI.Tests -c Release --no-build

      # The browser smoke tests need the published docs site and Chromium, so they can't run as part of a
      # plain `dotnet test` of the solution.
      - name: Publish the docs site
        run: dotnet publish docs/LumexUI.Docs -c Release -o artifacts/docs

      - name: Install Chromium for Playwright
        run: pwsh tests/LumexUI.Docs.SmokeTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Browser smoke tests
        run: dotnet test tests/LumexUI.Docs.SmokeTests -c Release --no-build
        env:
          LUMEXUI_DOCS_PATH: ${{ github.workspace }}/artifacts/docs

      - name: Pack LumexUI
        run: dotnet pack src/LumexUI/LumexUI.csproj -c Release --no-build --output nupkgs

      - name: Check package contents
        run: dotnet run scripts/check-package.cs -- nupkgs/LumexUI.*.nupkg

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
