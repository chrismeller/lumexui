name: Publish to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Credentials for the "chrismeller" GitHub Packages source in nuget.config.
      NuGetPackageSourceCredentials_chrismeller: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ./src/LumexUI
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: | 
          8.0.x
          9.0.x

    - name: Setup Node and pnpm
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5

    - name: Create NuGet package
      run: dotnet pack -c Release --output nupkgs

    - name: Push to GitHub Packages
      run: >-
        dotnet nuget push "nupkgs/*.nupkg"
        --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
        --api-key "${{ secrets.GITHUB_TOKEN }}"
